[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_vlacpp"
version = "0.1.0"
description = "lerobot policy plugin that runs vla.cpp (SmolVLA GGUF) as a remote inference backend over ZMQ"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25",
    "protobuf>=4",
    "numpy>=1.23",
    "transformers>=4",
]

[project.scripts]
vlacpp-build-pretrained = "lerobot_policy_vlacpp.build_pretrained:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_policy_vlacpp = ["vla.proto"]
